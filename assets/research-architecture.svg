<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">竞品助手：有状态的分析与交付架构</title><desc id="desc">九章方法规划审核单元，提示词结合研究范围、确认上下文和来源，按顺序生成并审核，保存状态与资料后输出研究稿和精简报告。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#51856f"/></marker><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#d7e0e9"/></pattern></defs><rect width="1120" height="510" rx="12" fill="#f7f9fc"/><rect width="1120" height="510" fill="url(#grid)"/><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:15px;font-weight:600;fill:#20354b}.sub{font-size:12px;fill:#617489}.label{font-size:11px;fill:#51856f;font-weight:600}.small{font-size:11px;fill:#728397}</style><text x="28" y="30" class="label" text-anchor="start">从方法到可控制的研究流程</text><text x="1090" y="30" class="small" text-anchor="end">任务编排  /  上下文继承  /  来源追溯</text><rect x="30" y="62" width="228" height="92" rx="9" fill="#fff" stroke="#cbd9ed"/><text x="46" y="89" class="title" text-anchor="start">定义研究范围</text><text x="46" y="110" class="sub" text-anchor="start">对象 · 目标 · 市场 · 时间</text><text x="46" y="128" class="sub" text-anchor="start">竞品名单与生成方式</text><rect x="293" y="62" width="242" height="92" rx="9" fill="#fff" stroke="#cbd9ed"/><text x="309" y="89" class="title" text-anchor="start">规划九章审核单元</text><text x="309" y="110" class="sub" text-anchor="start">目的 → 市场 → 竞品选择</text><text x="309" y="128" class="sub" text-anchor="start">战略 / 范围 / 结构 / 体验</text><rect x="570" y="62" width="245" height="92" rx="9" fill="#fff" stroke="#cbd9ed"/><text x="586" y="89" class="title" text-anchor="start">顺序生成当前单元</text><text x="586" y="110" class="sub" text-anchor="start">单 Agent 按章节依赖推进</text><text x="586" y="128" class="sub" text-anchor="start">SWOT → 综合结论与建议</text><rect x="850" y="62" width="240" height="92" rx="9" fill="#edf1ff" stroke="#bac9ed"/><text x="866" y="89" class="title" text-anchor="start">用户审核与校正</text><text x="866" y="110" class="sub" text-anchor="start">确认 / 定向修改 / 重新生成</text><text x="866" y="128" class="sub" text-anchor="start">逐段审核或连续生成</text><path d="M258 108 H288" fill="none" stroke="#51856f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M535 108 H565" fill="none" stroke="#51856f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M815 108 H845" fill="none" stroke="#51856f" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="30" y="215" width="505" height="96" rx="9" fill="#fff" stroke="#cbd9ed"/><text x="46" y="242" class="title" text-anchor="start">生成上下文</text><text x="46" y="263" class="sub" text-anchor="start">Skill 方法与写作规则  ＋  研究范围与当前竞品</text><text x="46" y="281" class="sub" text-anchor="start">已确认前文  ＋  已有来源  ＋  当前正文与修改要求</text><path d="M535 259 H551 V133 H565" fill="none" stroke="#51856f" stroke-width="1.5" marker-end="url(#arrow)"/><text x="35" y="192" class="label" text-anchor="start">每次生成都有明确输入边界</text><path d="M970 154 V183 H690 V158" fill="none" stroke="#51856f" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="797" y="177" class="label" text-anchor="start">反馈只重做当前单元</text><rect x="570" y="215" width="520" height="96" rx="9" fill="#fff7e8" stroke="#e2d4b5"/><text x="586" y="242" class="title" text-anchor="start">保存可继续的研究状态</text><text x="586" y="263" class="sub" text-anchor="start">审核进度与任务状态  /  单元正文  /  来源与局限</text><text x="586" y="281" class="sub" text-anchor="start">确认的结论进入后续上下文；失败重试、暂停后恢复</text><path d="M970 184 V210" fill="none" stroke="#51856f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M690 215 V191 H414 V158" fill="none" stroke="#51856f" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="570" y="343" class="label" text-anchor="start">研究完成后组织交付</text><rect x="30" y="371" width="300" height="91" rx="9" fill="#fff" stroke="#cbd9ed"/><text x="46" y="398" class="title" text-anchor="start">详细研究材料</text><text x="46" y="419" class="sub" text-anchor="start">保留各单元分析与来源</text><text x="46" y="437" class="sub" text-anchor="start">支持回看、复核与修改</text><rect x="410" y="371" width="300" height="91" rx="9" fill="#fff" stroke="#cbd9ed"/><text x="426" y="398" class="title" text-anchor="start">正式精简报告</text><text x="426" y="419" class="sub" text-anchor="start">收敛结论、优先级与行动</text><text x="426" y="437" class="sub" text-anchor="start">检查结构、篇幅和成品内容</text><rect x="790" y="371" width="300" height="91" rx="9" fill="#eaf4f0" stroke="#bbd5c9"/><text x="806" y="398" class="title" text-anchor="start">多格式交付</text><text x="806" y="419" class="sub" text-anchor="start">Markdown / Word / PDF</text><text x="806" y="437" class="sub" text-anchor="start">保留图表与报告结构</text><path d="M830 311 V350 H180 V365" fill="none" stroke="#51856f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M330 417 H405" fill="none" stroke="#51856f" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M710 417 H785" fill="none" stroke="#51856f" stroke-width="1.5" marker-end="url(#arrow)"/></svg>