<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc"><title id="title">产品方案工作台：分阶段的人机协作</title><desc id="desc">需求、规格、原型和PRD按确认内容推进，人工反馈回到阶段修订，规则检查与业务验收分别负责结构和合理性。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6380b4"/></marker><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#d7e0e9"/></pattern></defs><rect width="1120" height="510" rx="12" fill="#f7f9fc"/><rect width="1120" height="510" fill="url(#grid)"/><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:15px;font-weight:600;fill:#20354b}.sub{font-size:12px;fill:#617489}.label{font-size:11px;fill:#6380b4;font-weight:600}.small{font-size:11px;fill:#728397}</style><text x="28" y="30" class="label" text-anchor="start">阶段推进</text><text x="1090" y="30" class="small" text-anchor="end">AI 生成  /  人工确认  /  规则检查</text><text x="30" y="57" class="label" text-anchor="start">01</text><rect x="30" y="70" width="235" height="90" rx="9" fill="#fff" stroke="#cbd9ed"/><text x="46" y="97" class="title" text-anchor="start">需求与业务方案</text><text x="46" y="118" class="sub" text-anchor="start">目标用户 · 场景 · 范围</text><text x="46" y="136" class="sub" text-anchor="start">收敛需要解决的问题</text><text x="305" y="57" class="label" text-anchor="start">02</text><rect x="305" y="70" width="235" height="90" rx="9" fill="#fff" stroke="#cbd9ed"/><text x="321" y="97" class="title" text-anchor="start">原型规格</text><text x="321" y="118" class="sub" text-anchor="start">页面 · 流程 · 交互规则</text><text x="321" y="136" class="sub" text-anchor="start">把业务方案转为生成约束</text><text x="580" y="57" class="label" text-anchor="start">03</text><rect x="580" y="70" width="235" height="90" rx="9" fill="#fff" stroke="#cbd9ed"/><text x="596" y="97" class="title" text-anchor="start">高保真 HTML 原型</text><text x="596" y="118" class="sub" text-anchor="start">根据规格生成可交互页面</text><text x="596" y="136" class="sub" text-anchor="start">支持预览与操作</text><text x="855" y="57" class="label" text-anchor="start">04</text><rect x="855" y="70" width="235" height="90" rx="9" fill="#fff" stroke="#cbd9ed"/><text x="871" y="97" class="title" text-anchor="start">图文 PRD</text><text x="871" y="118" class="sub" text-anchor="start">整理需求、页面与验收说明</text><text x="871" y="136" class="sub" text-anchor="start">在线阅读 / Word 交付</text><path d="M265 111 H301" fill="none" stroke="#6380b4" stroke-width="1.5" marker-end="url(#arrow)"/><text x="267" y="96" class="small" text-anchor="start">确认后</text><path d="M540 111 H576" fill="none" stroke="#6380b4" stroke-width="1.5" marker-end="url(#arrow)"/><text x="542" y="96" class="small" text-anchor="start">确认后</text><path d="M147 160 V187" fill="none" stroke="#6380b4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="30" y="192" width="235" height="73" rx="9" fill="#edf1ff" stroke="#bac9ed"/><text x="46" y="219" class="title" text-anchor="start">用户确认方案</text><text x="46" y="240" class="sub" text-anchor="start">反馈 → 修订 → 再确认</text><path d="M422 160 V187" fill="none" stroke="#6380b4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="305" y="192" width="235" height="73" rx="9" fill="#edf1ff" stroke="#bac9ed"/><text x="321" y="219" class="title" text-anchor="start">用户确认规格</text><text x="321" y="240" class="sub" text-anchor="start">保存阶段最新确认内容</text><path d="M697 160 V187" fill="none" stroke="#6380b4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="580" y="192" width="235" height="73" rx="9" fill="#eaf4f0" stroke="#bbd5c9"/><text x="596" y="219" class="title" text-anchor="start">基础规则检查</text><text x="596" y="240" class="sub" text-anchor="start">HTML 结构检查与自动修复</text><path d="M972 160 V187" fill="none" stroke="#6380b4" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="855" y="192" width="235" height="73" rx="9" fill="#edf1ff" stroke="#bac9ed"/><text x="871" y="219" class="title" text-anchor="start">独立文档审阅</text><text x="871" y="240" class="sub" text-anchor="start">检查文档与已确认方案一致</text><rect x="580" y="308" width="235" height="68" rx="9" fill="#edf1ff" stroke="#bac9ed"/><text x="596" y="335" class="title" text-anchor="start">人工验收原型</text><text x="596" y="356" class="sub" text-anchor="start">业务流程与交互是否合理</text><path d="M697 265 V302" fill="none" stroke="#6380b4" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M580 342 H554 V144 H577" fill="none" stroke="#6380b4" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="417" y="341" class="label" text-anchor="start">反馈修订后再次验收</text><path d="M30 226 H16 V114 H27" fill="none" stroke="#6380b4" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/><path d="M305 226 H291 V114 H302" fill="none" stroke="#6380b4" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/><path d="M815 342 H836 V111 H850" fill="none" stroke="#6380b4" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/><text x="855" y="325" class="label" text-anchor="start">原型验收后</text><text x="855" y="346" class="sub" text-anchor="start">进入文档生成与审阅</text><rect x="30" y="414" width="1060" height="65" rx="9" fill="#eef2f8" stroke="#d7e0eb"/><text x="48" y="440" class="label" text-anchor="start">贯穿全流程</text><text x="181" y="440" class="title" text-anchor="start">版本衔接：后续生成沿用最新确认内容</text><text x="181" y="461" class="sub" text-anchor="start">异常应对：停止 / 超时处理；修复试跑中循环阻塞、无法推进的问题</text></svg>